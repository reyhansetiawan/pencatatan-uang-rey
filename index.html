<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pencatatan Uang - REY</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #f0f4f8; min-height: 100vh; padding: 16px; }
  .container { max-width: 420px; margin: 0 auto; }
  h1 { text-align: center; font-size: 22px; margin-bottom: 12px; color: #1a3c5e; }
  .saldo-box { background: linear-gradient(135deg, #1a6fc4, #155a9e); color: #fff;
    border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 14px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .saldo-box small { font-size: 13px; opacity: .85; }
  .saldo-box .jumlah { font-size: 32px; font-weight: bold; margin-top: 4px; }
  .form { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .form label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; margin-top: 8px; }
  .form input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;
    font-size: 16px; }
  .form input:focus { outline: none; border-color: #1a6fc4; }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px;
    font-weight: bold; cursor: pointer; margin-top: 12px; }
  .btn-simpan { background: #e74c3c; color: #fff; }
  .btn-simpan:active { background: #c0392b; }
  .btn-reset { background: #95a5a6; color: #fff; margin-top: 8px; }
  .riwayat h2 { font-size: 16px; margin-bottom: 8px; color: #1a3c5e; }
  .riwayat-box { background: #fff; border-radius: 14px; padding: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .item { display: flex; justify-content: space-between; padding: 10px 4px;
    border-bottom: 1px solid #eee; font-size: 14px; }
  .item:last-child { border-bottom: none; }
  .item .ket { color: #333; }
  .item .ket small { display: block; color: #999; font-size: 11px; }
  .item .nom { color: #e74c3c; font-weight: bold; }
  .kosong { text-align: center; color: #999; padding: 16px; font-size: 13px; }
  .pesan { display: none; background: #2ecc71; color: #fff; text-align: center;
    padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
</style>
<base target="_blank">
</head>
<body>
<div class="container">
  <h1>💰 Pencatatan Uang REY</h1>

  <div class="saldo-box">
    <small>SISA UANG SAYA</small>
    <div class="jumlah" id="saldo">Rp 6.500.000</div>
  </div>

  <div class="pesan" id="pesan">✓ Pengeluaran tercatat!</div>

  <div class="form">
    <label>Keterangan Pengeluaran</label>
    <input type="text" id="ket" placeholder="Contoh: Belanja makanan">
    <label>Jumlah (Rp)</label>
    <input type="number" id="jml" placeholder="Contoh: 50000">
    <button class="btn btn-simpan" onclick="simpan()">💸 SIMPAN PENGELUARAN</button>
    <button class="btn btn-reset" onclick="resetSemua()">↺ RESET KE Rp 6.500.000</button>
  </div>

  <div class="riwayat">
    <h2>📋 Riwayat Pengeluaran</h2>
    <div class="riwayat-box" id="list"></div>
  </div>
</div>

<script>
const AWAL = 6500000;
let data = JSON.parse(localStorage.getItem("uang_rey") || "[]");

function format(n) {
  return "Rp " + n.toLocaleString("id-ID");
}

function render() {
  let keluar = data.reduce((a, b) => a + b.jml, 0);
  document.getElementById("saldo").textContent = format(AWAL - keluar);
  let list = document.getElementById("list");
  if (data.length === 0) {
    list.innerHTML = '<div class="kosong">Belum ada pengeluaran</div>';
    return;
  }
  list.innerHTML = data.map((d, i) =>
    '<div class="item"><div class="ket">' + d.ket +
    '<small>' + d.tgl + '</small></div><div class="nom">- ' +
    format(d.jml) + '</div></div>'
  ).join("");
}

function simpan() {
  let ket = document.getElementById("ket").value.trim();
  let jml = Number(document.getElementById("jml").value);
  if (!ket || !jml || jml <= 0) { alert("Isi keterangan dan jumlah dengan benar!"); return; }
  let keluar = data.reduce((a, b) => a + b.jml, 0);
  if (AWAL - keluar - jml < 0) { alert("Sisa uang tidak cukup!"); return; }
  let tgl = new Date().toLocaleString("id-ID", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
  data.push({ ket, jml, tgl });
  localStorage.setItem("uang_rey", JSON.stringify(data));
  document.getElementById("ket").value = "";
  document.getElementById("jml").value = "";
  let p = document.getElementById("pesan");
  p.style.display = "block";
  setTimeout(() => p.style.display = "none", 1500);
  render();
}

function resetSemua() {
  if (confirm("Yakin mau reset semua data? Saldo kembali ke Rp 6.500.000")) {
    data = [];
    localStorage.removeItem("uang_rey");
    render();
  }
}

render();
</script>
</body>
</html>
