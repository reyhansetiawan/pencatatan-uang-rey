<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Keuangan Dana KIP - REY</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #f0f4f8; min-height: 100vh; padding: 12px; }
  .container { max-width: 650px; margin: 0 auto; }
  h1 { text-align: center; font-size: 20px; margin-bottom: 10px; color: #1a3c5e; }
  
  .saldo-box { background: linear-gradient(135deg, #1a6fc4, #155a9e); color: #fff;
    border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .saldo-box small { font-size: 12px; opacity: .85; }
  .saldo-box .jumlah { font-size: 28px; font-weight: bold; margin-top: 4px; }

  .form { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .form label { font-size: 12px; color: #555; display: block; margin-bottom: 3px; margin-top: 8px; }
  .form input, .form select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 14px; }
  .form input:focus, .form select:focus { outline: none; border-color: #1a6fc4; }

  .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px;
    font-weight: bold; cursor: pointer; margin-top: 10px; }
  .btn-simpan { background: #27ae60; color: #fff; }
  .btn-simpan:active { background: #219653; }
  .btn-reset { background: #95a5a6; color: #fff; margin-top: 6px; }

  .pesan { display: none; background: #2ecc71; color: #fff; text-align: center;
    padding: 8px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }

  .riwayat h2 { font-size: 15px; margin-bottom: 6px; color: #1a3c5e; }
  .table-container { background: #fff; border-radius: 12px; padding: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08); overflow-x: auto; }
  
  table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
  th { background: #f4b183; color: #000; font-weight: bold; text-align: center; }
  .text-right { text-align: right; }
  .text-center { text-align: center; }
  .debit { color: #27ae60; font-weight: bold; }
  .kredit { color: #e74c3c; font-weight: bold; }
  .kosong { text-align: center; color: #999; padding: 16px; font-size: 12px; }
</style>
<base target="_blank">
</head>
<body>
<div class="container">
  <h1>📊 Laporan Keuangan Dana KIP - REY</h1>

  <div class="saldo-box">
    <small>SISA SALDO SAAT INI</small>
    <div class="jumlah" id="saldo-akhir">Rp 6.600.000</div>
  </div>

  <div class="pesan" id="pesan">✓ Transaksi berhasil dicatat!</div>

  <div class="form">
    <label>Tanggal</label>
    <input type="date" id="tgl">
    
    <label>Uraian / Transaksi</label>
    <input type="text" id="uraian" placeholder="Contoh: beli laptop / bayar kuliah">

    <label>Jenis Transaksi</label>
    <select id="jenis">
      <option value="kredit">Pengeluaran (Kredit)</option>
      <option value="debit">Pemasukan / Tambah Saldo (Debit)</option>
    </select>

    <label>Jumlah (Rp)</label>
    <input type="text" id="jml" placeholder="Contoh: 200.000" oninput="formatInputRibuan(this)">

    <label>Keterangan (Opsional)</label>
    <input type="text" id="ket" placeholder="Contoh: buat belajar / pegangan">

    <button class="btn btn-simpan" onclick="simpan()">💾 SIMPAN TRANSAKSI</button>
    <button class="btn btn-reset" onclick="resetSemua()">↺ RESET DATA KE Rp 6.600.000</button>
  </div>

  <div class="riwayat">
    <h2>📋 Tabel Riwayat Keuangan</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Tanggal</th>
            <th>Uraian</th>
            <th>Debit</th>
            <th>Kredit</th>
            <th>Saldo</th>
            <th>Keterangan</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="list-tabel">
          <!-- Data masuk lewat JS -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SALDO_AWAL = 6600000;
document.getElementById('tgl').valueAsDate = new Date();

let data = JSON.parse(localStorage.getItem("keuangan_kip_rey_v3") || "[]");

function formatRupiah(n) {
  return "Rp " + Number(n).toLocaleString("id-ID");
}

function formatInputRibuan(e) {
  let value = e.value.replace(/\D/g, "");
  if (value === "") {
    e.value = "";
    return;
  }
  e.value = Number(value).toLocaleString("id-ID");
}

function parseAngka(str) {
  if (!str) return 0;
  return Number(str.toString().replace(/\./g, "").replace(/,/g, ""));
}

function formatTanggal(tglStr) {
  if (!tglStr) return "";
  let parts = tglStr.split("-");
  let d = new Date(parts[0], parts[1] - 1, parts[2]);
  return d.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
}

function render() {
  let listTabel = document.getElementById("list-tabel");
  let saldoBerjalan = SALDO_AWAL;

  let html = `
    <tr style="background-color: #f9f9f9; font-weight: bold;">
      <td class="text-center">1</td>
      <td>-</td>
      <td>Saldo Awal KIP</td>
      <td class="text-right debit">${formatRupiah(SALDO_AWAL)}</td>
      <td class="text-right kredit">Rp 0</td>
      <td class="text-right">${formatRupiah(SALDO_AWAL)}</td>
      <td>Pencairan KIP</td>
      <td class="text-center">-</td>
    </tr>
  `;

  data.forEach((d, i) => {
    let debitVal = d.jenis === 'debit' ? parseAngka(d.jml) : 0;
    let kreditVal = d.jenis === 'kredit' ? parseAngka(d.jml) : 0;
    
    saldoBerjalan = saldoBerjalan + debitVal - kreditVal;

    html += `<tr>
      <td class="text-center">${i + 2}</td>
      <td>${formatTanggal(d.tgl)}</td>
      <td>${d.uraian}</td>
      <td class="text-right debit">${debitVal > 0 ? formatRupiah(debitVal) : 'Rp 0'}</td>
      <td class="text-right kredit">${kreditVal > 0 ? formatRupiah(kreditVal) : 'Rp 0'}</td>
      <td class="text-right" style="font-weight:bold;">${formatRupiah(saldoBerjalan)}</td>
      <td>${d.ket || '-'}</td>
      <td class="text-center"><button onclick="hapusItem(${i})" style="background:#e74c3c;color:#fff;border:none;padding:2px 6px;border-radius:4px;cursor:pointer;">Hapus</button></td>
    </tr>`;
  });

  listTabel.innerHTML = html;
  document.getElementById("saldo-akhir").textContent = formatRupiah(saldoBerjalan);
}

function simpan() {
  let tgl = document.getElementById("tgl").value;
  let uraian = document.getElementById("uraian").value.trim();
  let jenis = document.getElementById("jenis").value;
  let jmlStr = document.getElementById("jml").value;
  let jml = parseAngka(jmlStr);
  let ket = document.getElementById("ket").value.trim();

  if (!tgl || !uraian || !jml || jml <= 0) {
    alert("Mohon isi tanggal, uraian, dan jumlah dengan benar!");
    return;
  }

  data.push({ tgl, uraian, jenis, jml: jmlStr, ket });
  localStorage.setItem("keuangan_kip_rey_v3", JSON.stringify(data));

  document.getElementById("uraian").value = "";
  document.getElementById("jml").value = "";
  document.getElementById("ket").value = "";

  let p = document.getElementById("pesan");
  p.style.display = "block";
  setTimeout(() => p.style.display = "none", 1500);

  render();
}

function hapusItem(index) {
  if (confirm("Yakin ingin menghapus transaksi ini?")) {
    data.splice(index, 1);
    localStorage.setItem("keuangan_kip_rey_v3", JSON.stringify(data));
    render();
  }
}

function resetSemua() {
  if (confirm("Yakin ingin menghapus seluruh data pengeluaran? Saldo akan kembali ke Rp 6.600.000")) {
    data = [];
    localStorage.removeItem("keuangan_kip_rey_v3");
    render();
  }
}

render();
</script>
</body>
</html>
